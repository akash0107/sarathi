<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" role="img" aria-labelledby="t"><title id="t">Sharding splits tests across machines; workers run tests in parallel on each machine; blob reports are merged</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8bd68"/></marker></defs>
<rect width="400" height="456" rx="18" fill="#0b1233"/><text x="200.0" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f6d999" text-anchor="middle">Workers vs shards</text><text x="200.0" y="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#aab1d6" text-anchor="middle">shards = machines · workers = processes on one machine</text><rect x="24" y="70" width="352" height="52" rx="14" fill="#141c47" stroke="#e8bd68" stroke-width="2"/><text x="200.0" y="93" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e8bd68" text-anchor="middle">100 tests  →  npx playwright test --shard=k/2</text><text x="200.0" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#eceefb" text-anchor="middle">each CI machine gets ~half the tests</text><line x1="200.0" y1="124" x2="110" y2="150" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/><rect x="24" y="154" width="172" height="196" rx="14" fill="#141c47" stroke="#2cc4b5" stroke-width="2"/><text x="110" y="178" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2cc4b5" text-anchor="middle">🖥 Machine 1 (shard 1/2)</text><text x="110" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#aab1d6" text-anchor="middle">~50 tests · workers: 2</text><rect x="36" y="208" width="148" height="52" rx="10" fill="#0b1233" stroke="#2cc4b5" stroke-width="1"/><text x="110" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eceefb" text-anchor="middle">⚙ Worker 0</text><text x="110" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#aab1d6" text-anchor="middle">own process + browser</text><rect x="36" y="270" width="148" height="52" rx="10" fill="#0b1233" stroke="#2cc4b5" stroke-width="1"/><text x="110" y="292" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eceefb" text-anchor="middle">⚙ Worker 1</text><text x="110" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#aab1d6" text-anchor="middle">own process + browser</text><line x1="200.0" y1="124" x2="290" y2="150" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/><rect x="204" y="154" width="172" height="196" rx="14" fill="#141c47" stroke="#b79cff" stroke-width="2"/><text x="290" y="178" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#b79cff" text-anchor="middle">🖥 Machine 2 (shard 2/2)</text><text x="290" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#aab1d6" text-anchor="middle">~50 tests · workers: 2</text><rect x="216" y="208" width="148" height="52" rx="10" fill="#0b1233" stroke="#b79cff" stroke-width="1"/><text x="290" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eceefb" text-anchor="middle">⚙ Worker 0</text><text x="290" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#aab1d6" text-anchor="middle">own process + browser</text><rect x="216" y="270" width="148" height="52" rx="10" fill="#0b1233" stroke="#b79cff" stroke-width="1"/><text x="290" y="292" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eceefb" text-anchor="middle">⚙ Worker 1</text><text x="290" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#aab1d6" text-anchor="middle">own process + browser</text><line x1="114" y1="352" x2="190" y2="384" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/><line x1="294" y1="352" x2="214" y2="384" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="388" width="280" height="52" rx="14" fill="#141c47" stroke="#f08a9b" stroke-width="2"/><text x="200.0" y="410" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f08a9b" text-anchor="middle">blob reports → merge-reports</text><text x="200.0" y="428" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#eceefb" text-anchor="middle">one HTML report</text></svg>