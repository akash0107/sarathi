<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 494" width="400" height="494" role="img" aria-labelledby="t">
<title id="t">Drivers are required plugs per platform; plugins are optional extras</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e8bd68"/></marker>
<marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2cc4b5"/></marker></defs>
<rect width="400" height="494" rx="18" fill="#0b1233"/>
<text x="200.0" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f6d999" text-anchor="middle">Drivers vs plugins</text>
<text x="200.0" y="56" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aab1d6" text-anchor="middle">driver = the plug (required) · plugin = an extra (optional)</text>
<rect x="110" y="74" width="180" height="62" rx="14" fill="#141c47" stroke="#e8bd68" stroke-width="2"/>
<text x="200.0" y="100" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e8bd68" text-anchor="middle">🛰️ Appium server</text>
<text x="200.0" y="121" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aab1d6" text-anchor="middle">does nothing alone</text>
<line x1="160" y1="138" x2="95" y2="184" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="240" y1="138" x2="305" y2="184" stroke="#e8bd68" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="20" y="186" width="170" height="150" rx="14" fill="#141c47" stroke="#2cc4b5" stroke-width="2"/>
<text x="105" y="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2cc4b5" text-anchor="middle">DRIVERS · required</text>
<rect x="32" y="222" width="146" height="44" rx="10" fill="#0b1233" stroke="#2cc4b5" stroke-width="1.2"/>
<text x="105" y="241" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eceefb" text-anchor="middle">UiAutomator2</text>
<text x="105" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aab1d6" text-anchor="middle">→ Android</text>
<rect x="32" y="276" width="146" height="44" rx="10" fill="#0b1233" stroke="#2cc4b5" stroke-width="1.2"/>
<text x="105" y="295" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eceefb" text-anchor="middle">XCUITest</text>
<text x="105" y="312" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aab1d6" text-anchor="middle">→ iPhone / iPad</text>
<rect x="210" y="186" width="170" height="150" rx="14" fill="#141c47" stroke="#b79cff" stroke-width="2"/>
<text x="295" y="210" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b79cff" text-anchor="middle">PLUGINS · optional</text>
<rect x="222" y="222" width="146" height="44" rx="10" fill="#0b1233" stroke="#b79cff" stroke-width="1.2"/>
<text x="295" y="241" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eceefb" text-anchor="middle">images</text>
<text x="295" y="258" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aab1d6" text-anchor="middle">find by picture</text>
<rect x="222" y="276" width="146" height="44" rx="10" fill="#0b1233" stroke="#b79cff" stroke-width="1.2"/>
<text x="295" y="295" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#eceefb" text-anchor="middle">+ others</text>
<text x="295" y="312" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aab1d6" text-anchor="middle">gestures, relaxed caps…</text>
<rect x="20" y="352" width="360" height="126" rx="12" fill="#070b24" stroke="#aab1d6" stroke-width="1"/>
<text x="36" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#2cc4b5" text-anchor="start">$ appium driver install uiautomator2</text>
<text x="36" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#2cc4b5" text-anchor="start">$ appium driver list --installed</text>
<text x="36" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#b79cff" text-anchor="start">$ appium plugin install images</text>
<text x="36" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#b79cff" text-anchor="start">$ appium --use-plugins=images</text>
</svg>